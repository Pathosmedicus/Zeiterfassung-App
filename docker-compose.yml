services:
  zeiterfassung-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeiterfassung_web
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
