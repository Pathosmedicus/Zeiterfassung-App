name: Deploy Zeiterfassung PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PWA
        env:
          VITE_FIREBASE_API_KEY: 'AIzaSyAkqcW0nGb0bNgZZoV6mfdF-HAylwjeYtw'
          VITE_FIREBASE_AUTH_DOMAIN: 'zeiterfassung-app-56bfa.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'zeiterfassung-app-56bfa'
          VITE_FIREBASE_STORAGE_BUCKET: 'zeiterfassung-app-56bfa.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '48863732219'
          VITE_FIREBASE_APP_ID: '1:48863732219:web:7202f1e35ffd4600e76b5e'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
